name: Actualizar y publicar calendario FCBQ

on:
  schedule:
    - cron: "17 6 * * 0"
      timezone: "Europe/Madrid"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4
      - name: Actualizar calendario desde FCBQ
        run: python scripts/update_calendar.py
      - name: Guardar calendario actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basquet-alella-a.ics
          git diff --cached --quiet || git commit -m "Actualizar calendario FCBQ"
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
